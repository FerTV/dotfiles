[manager]
show_hidden = true
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "none"
show_symlink = true

[opener]
play = [
	{ run = 'mpv "$@"', orphan = true, for = "unix" }
]

[open]
rules = [
    # Si es video, usa el opener "play"
    { mime = "video/*", use = "play" },
    # Reglas específicas por si acaso
    { name = "*.mp4", use = "play" },
    { name = "*.mkv", use = "play" },
]

[preview]
max_width = 1200
max_height = 1500
